name: counter_app
description: "Restaurant Counter POS Billing App with Supabase & Bluetooth ESC/POS Thermal Printing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase SDK for Flutter
  supabase_flutter: ^2.5.6
  
  # Bluetooth ESC/POS Thermal Printing
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.1
  permission_handler: ^11.3.1
  
  # State Management & Helpers
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
